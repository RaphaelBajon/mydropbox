[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mydropbox"
version = "0.2.1"
authors = [{name = "Raphaël Bajon"}]
description = "A library for managing UHM Ocean BGC Group Dropbox paths"
readme = "README.md"
requires-python = ">=3.10"
# Core library has no mandatory external dependencies.
# The scientific stack below is optional but expected for typical usage.
dependencies = []

[project.optional-dependencies]
science = [
    "xarray",
    "numpy",
    "matplotlib",
    "pandas",
]
sdk = [
    "dropbox",
]
dev = [
    "xarray",
    "numpy",
    "matplotlib",
    "pandas",
    "scipy",
    "pytest",
    "pytest-cov",
    "ruff",
    "dropbox",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mydropbox*"]