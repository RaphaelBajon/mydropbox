# MyDropbox configuration
# Copy this file to ~/.mydropbox.yml (recommended) or ./mydropbox.yml
# and fill in your values.  ~/.mydropbox.yml is never committed to Git.

dropbox:
  PERSONAL_FOLDER: "Raphaël Bajon"          # your personal folder name in the group Dropbox
  DROPBOX_BASE_PATH: None      # leave null for auto-detection
