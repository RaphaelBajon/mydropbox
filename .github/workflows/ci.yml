name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml xarray numpy matplotlib pandas scipy pytest pytest-cov dropbox
          pip install -e .

      - name: Run tests
        run: |
          # test_real_dropbox.py is skipped automatically when the real
          # Dropbox folder is absent (which it always is in CI)
          pytest tests/ -v --tb=short
